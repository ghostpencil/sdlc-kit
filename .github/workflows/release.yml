name: Release

# Packages sdlc-kit/ as a downloadable artifact on tag push, so the archive can never
# drift from the tag it claims to be. The README quick start points at these assets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check VERSION matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat sdlc-kit/VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag but sdlc-kit/VERSION says $file"
            exit 1
          fi

      - name: Check MANIFEST.sha256 is current
        # A stale manifest is worse than none: it would report drift on files that never
        # changed, and clear files that did.
        run: cd sdlc-kit && sha256sum -c MANIFEST.sha256

      - name: Check the bundle is self-sufficient
        # MIT requires the license text to travel with redistributed copies.
        run: |
          for f in LICENSE THIRD_PARTY_NOTICES.md README.md VERSION MANIFEST.sha256; do
            test -f "sdlc-kit/$f" || { echo "::error::sdlc-kit/$f missing from bundle"; exit 1; }
          done

      - name: Check the manifest covers every file
        # `sha256sum -c` proves listed files are unchanged; it says nothing about files
        # missing from the list. Without this, a new file ships unverifiable.
        run: |
          cd sdlc-kit
          find . -type f -not -name MANIFEST.sha256 | sed 's|^\./||' | sort > /tmp/actual
          cut -d' ' -f3- MANIFEST.sha256 | sort > /tmp/listed
          if ! diff -u /tmp/listed /tmp/actual; then
            echo "::error::MANIFEST.sha256 does not list every file in the bundle"
            exit 1
          fi

      - name: Package
        # Stable, version-free asset names: they make the README's
        # releases/latest/download/… one-liner work verbatim on every release. The
        # version still travels in the tag, the release title, and sdlc-kit/VERSION
        # inside the archive. (Releases up to v0.6.0 used sdlc-kit-<version>.* names.)
        run: |
          tar -czf sdlc-kit.tar.gz sdlc-kit
          zip -qr sdlc-kit.zip sdlc-kit
          sha256sum sdlc-kit.tar.gz sdlc-kit.zip > sdlc-kit.CHECKSUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Heredoc, not an inline multi-line string. YAML strips this block's common
          # indentation, so the runner sees EOF at column 0 and the heredoc terminates.
          # An inline "--notes" string cannot work here: its continuation lines would
          # have to sit at column 0 in the source, which ends the block scalar and makes
          # the whole workflow file invalid.
          cat > /tmp/notes.md <<EOF
          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          Extract \`sdlc-kit/\` into the root of your project, copy
          \`sdlc-kit/commands/sdlc-setup.md\` into \`.claude/commands/\`, and run \`/sdlc-setup\`.

          Verify the bundle with \`cd sdlc-kit && sha256sum -c MANIFEST.sha256\`.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            sdlc-kit.tar.gz sdlc-kit.zip sdlc-kit.CHECKSUMS.txt
